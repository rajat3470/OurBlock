# Nginx configuration for mohallaMitr self-contained EC2 deployment.
# Designed for a single domain with path-based routing:
#   /api/*       -> Node backend (with /api prefix stripped)
#   /socket.io/* -> Node backend WebSocket
#   /health      -> Node backend health check
#   /uploads/*   -> MinIO (only if you self-host public uploads on EC2)
#   /*           -> Next.js static export (web admin)
#
# Replace YOUR_DOMAIN and /var/www/mohallamitr with your actual values.
# For HTTPS, run certbot after placing this file.

upstream backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Optional: upstream for MinIO if you expose it through Nginx.
upstream minio {
    server 127.0.0.1:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/mohallamitr/apps/web/out;
    index index.html;

    # ---------------------------------------------------------------
    # Security / performance headers
    # ---------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # Backend API — strip /api prefix before forwarding
    # ---------------------------------------------------------------
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # ---------------------------------------------------------------
    # Health check (also proxied to backend)
    # ---------------------------------------------------------------
    location = /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------------------------------------------------------------
    # WebSocket support for Socket.IO
    # ---------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------
    # MinIO public uploads (optional)
    # Comment this out if you use AWS S3 / R2 and serve files from there.
    # ---------------------------------------------------------------
    # location /uploads/ {
    #     rewrite ^/uploads/(.*) /mohallamitr/$1 break;
    #     proxy_pass http://minio;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_hide_header x-amz-id-2;
    #     proxy_hide_header x-amz-request-id;
    # }

    # ---------------------------------------------------------------
    # Next.js static export fallback
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------
    access_log /var/log/nginx/mohallamitr-access.log;
    error_log /var/log/nginx/mohallamitr-error.log;
}

# Optional: redirect www to non-www (or vice versa)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name www.YOUR_DOMAIN;
#     return 301 $scheme://YOUR_DOMAIN$request_uri;
# }
