# Local production-like stack for testing before AWS deployment.
# Usage:
#   cp .env.example .env          # edit values
#   docker compose -f docker-compose.prod.yml up --build
#
# This is NOT the AWS deployment template; use DEPLOYMENT.md for that.
version: "3.8"

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: mohallamitr
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..            # repo root so yarn workspaces resolve
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:mongo@mongo:27017/mohallamitr?authSource=admin
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/mohallamitr
      PORT: "5001"
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mongodata:
  miniodata:
